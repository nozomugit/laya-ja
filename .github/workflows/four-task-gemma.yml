name: Japanese independent Gemma inference
on:
  push:
    branches: [experiment/japanese-gemma-transfer]
    paths:
      - ".github/workflows/four-task-gemma.yml"
      - "tools/four-task/**"
      - "four_task_prompts.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify fixed evaluation inputs
        run: python3 tools/four-task/prepare.py --semantic --out batch --shards 8 --shard "${{ matrix.shard }}"
      - name: Build the CPU scorer
        run: |
          git init -q runtime
          git -C runtime fetch --depth=1 https://github.com/ggml-org/llama.cpp.git ccd360f060a0f17b87ee0d4c5d91ee84cfdff484
          git -C runtime checkout -q --detach FETCH_HEAD
          cmake -S runtime -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_OPENSSL=OFF
          cmake --build build --target llama -j 4
          c++ -O2 -std=c++17 -Iruntime/include -Iruntime/ggml/include -Iruntime/vendor tools/four-task/label.cpp -Lbuild/bin -Wl,-rpath,"$PWD/build/bin" -lllama -lggml -lggml-base -o score
      - name: Verify quantized weights
        run: |
          curl --retry 3 --fail --location --silent --show-error https://huggingface.co/unsloth/gemma-4-26B-A4B-it-GGUF/resolve/c099eb48e663fd284577b04978a94ffccb261841/gemma-4-26B-A4B-it-UD-Q3_K_M.gguf -o model.gguf
          echo "811882f6df81c8ea204a5d382f196d6bd601245091786912d4c70df41cdfa052  model.gguf" | sha256sum --check
      - name: Evaluate with up to 160 reasoning tokens
        run: |
          mkdir records
          for view in gemma; do
            ./score model.gguf batch/"$view".jsonl records/"$view".jsonl 4 4 160 gemma 2> "$view".log || { tail -25 "$view".log; exit 1; }
            sha256sum records/"$view".jsonl
            test "$(wc -l < records/"$view".jsonl)" -eq "$(wc -l < batch/"$view".jsonl)"
          done
      - name: Save per-item logits
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: japanese-gemma-${{ matrix.shard }}
          path: records/*.jsonl
          retention-days: 1
