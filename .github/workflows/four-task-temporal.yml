name: Japanese template-hard temporal transfer
on:
  push:
    branches: [experiment/japanese-temporal-hard]
    paths:
      - ".github/workflows/four-task-temporal.yml"
      - "tools/four-task/**"
      - "four_task_prompts.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify fixed evaluation inputs
        run: python3 tools/four-task/prepare-temporal.py --out batch --shards 4 --shard "${{ matrix.shard }}"
      - name: Build the CPU scorer
        run: |
          git init -q runtime
          git -C runtime fetch --depth=1 https://github.com/ggml-org/llama.cpp.git ccd360f060a0f17b87ee0d4c5d91ee84cfdff484
          git -C runtime checkout -q --detach FETCH_HEAD
          cmake -S runtime -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_OPENSSL=OFF
          cmake --build build --target llama -j 4
          c++ -O2 -std=c++17 -Iruntime/include -Iruntime/ggml/include -Iruntime/vendor tools/four-task/label.cpp -Lbuild/bin -Wl,-rpath,"$PWD/build/bin" -lllama -lggml -lggml-base -o score
      - name: Verify quantized weights
        run: |
          curl --retry 3 --fail --location --silent --show-error https://huggingface.co/unsloth/Qwen3.6-35B-A3B-GGUF/resolve/a483e9e6cbd595906af30beda3187c2663a1118c/Qwen3.6-35B-A3B-UD-IQ3_XXS.gguf -o model.gguf
          echo "9c964e657212fea1f24905dd7b0a89b82fd807d19fab0b41da14251b07b88fbe  model.gguf" | sha256sum --check
      - name: Evaluate the temporal prompts
        run: |
          mkdir records
          for view in temporal; do
            ./score model.gguf batch/"$view".jsonl records/"$view".jsonl 4 4 2> "$view".log || { tail -25 "$view".log; exit 1; }
            sha256sum records/"$view".jsonl
            test "$(wc -l < records/"$view".jsonl)" -eq "$(wc -l < batch/"$view".jsonl)"
          done
      - name: Save per-item logits
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: japanese-temporal-${{ matrix.shard }}
          path: records/*.jsonl
          retention-days: 1
